[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-automation"
version = "5.1.0"
description = "Production-grade automated email dispatch for arXiv endorsement outreach"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nixon-H", email = "aditya@example.com" }]
keywords = ["arxiv", "endorsement", "email", "automation", "outreach"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
xlsx = ["openpyxl>=3.1"]
dns = ["dnspython>=2.4"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "bandit>=1.7",
    "ruff>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "bandit>=1.7",
    "ruff>=0.1",
    "pip-audit>=2.0",
    "safety>=2.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]
all = ["pyyaml>=6.0", "openpyxl>=3.1", "dnspython>=2.4"]

[project.urls]
Homepage = "https://github.com/anomalyco/arxiv-automation"
Documentation = "https://github.com/anomalyco/arxiv-automation#readme"
Issues = "https://github.com/anomalyco/arxiv-automation/issues"

[project.scripts]
arxiv-mail = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engine*", "parsing*", "exports*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -p no:cacheprovider"

[tool.coverage.run]
source = ["core", "engine", "parsing", "exports"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 30

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "site"]
skips = ["B404", "B603", "B607", "B110", "B310", "B311"]

[tool.semantic-release]
version_variable = "pyproject.toml:version"
branch = "main"
build_command = "pip install -e ."
changelog = true
