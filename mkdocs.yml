site_name: arXiv Automation
site_description: Automated arXiv endorsement outreach engine
site_url: https://nixon-h.github.io/arxiv-automation/
repo_url: https://github.com/Nixon-H/arxiv-automation
edit_uri: blob/main/docs/

theme:
  name: material
  icon:
    logo: fontawesome/solid/paper-plane
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[hl];;'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_if_no_docstring: true
            docstring_style: google

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

copyright: Copyright &copy; 2026 Nixon — MIT License

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nixon-H
  generator: false

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - CLI Reference: cli.md
  - Configuration: configuration.md
  - Input Format: input-format.md
  - Templates: templates.md
  - API Reference:
      - Core:
          - Config: api/core/config.md
          - Database: api/core/database.md
          - Logger: api/core/logger.md
          - Validator: api/core/validator.md
          - Tracker: api/core/tracker.md
          - Doctor: api/core/doctor.md
      - Engine:
          - Orchestrator: api/engine/orchestrator.md
          - SMTP: api/engine/smtp.md
          - Templates: api/engine/templates.md
          - Plugins: api/engine/plugins.md
      - Parsing:
          - Parser: api/parsing/parser.md
          - Bounce: api/parsing/bounce.md
      - Exports:
          - Report: api/exports/report.md
  - Development: development.md
  - Security: security.md
